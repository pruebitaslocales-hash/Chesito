<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Te queremos chesito</title>
  <meta name="description" content="Libro de cocina interactivo en 3D - La Receta de Nuestra Amistad">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Caveat:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=1">
</head>
<body>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<!-- Controls -->
<div class="controls" id="controls">
  <button onclick="prevPage()" id="btnPrev" disabled>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 19l-7-7 7-7"/></svg>
    <span>Anterior</span>
  </button>
  <div class="page-indicator" id="pageIndicator">PORTADA</div>
  <button onclick="nextPage()" id="btnNext">
    <span>Siguiente</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="sep"></div>

  <!-- Player Widget -->
  <div class="player-widget" id="playerWidget">
    <button class="player-main-btn" id="btnMusic" onclick="toggleMusic()">
      <svg class="player-icon-play" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
      <svg class="player-icon-pause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
    </button>
    <div class="player-track-info" id="playerTrackInfo" onclick="togglePlaylist()">
      <span class="player-track-name" id="playerTrackName">Música del Chef</span>
      <svg class="player-caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="player-popover" id="playerPopover">
      <div class="player-pop-header">
        <span class="player-pop-title">🎵 Playlist</span>
        <button class="player-pop-close" onclick="closePlaylist()" title="Cerrar">&times;</button>
      </div>
      <div class="player-pop-body" id="playerPopBody"></div>
    </div>
  </div>

  <div class="sep"></div>
  <button onclick="resetProgress()" id="btnReset" title="Reiniciar avance">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 1 9 9"/><polyline points="3 21 3 12 12 12"/></svg>
  </button>
</div>

<!-- Book -->
<div class="book-stage" id="bookStage">
  <div class="book" id="book">
    <div class="spine"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-body-inner" id="modalContent"></div>
  </div>
</div>

<canvas id="confettiCanvas"></canvas>
<audio id="bgMusic" loop preload="none"></audio>

<script src="js/saved-config.js"></script>
<script src="js/app.js?v=2"></script>
<script>if(location.search.includes('edit')){var s=document.createElement('script');s.src='js/admin.js?v='+Date.now();document.body.appendChild(s);}</script>
</body>
</html>
